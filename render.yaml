services:
  # Backend Node.js Express + Socket.IO Web Service
  - type: web
    name: restaurant-cloud-backend
    env: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VIETQR_BANK_ID
        value: MB
      - key: VIETQR_ACCOUNT_NO
        value: "0963769034"
      - key: VIETQR_ACCOUNT_NAME
        value: "CAO QUOC ANH"
      - key: CLIENT_URL
        value: "*"
